name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'output/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Cache Godot Web tools
        id: tools
        uses: actions/cache@v4
        with:
          path: .build/tools
          key: godot-4.6.3-web-nothreads-linux-v1
      - name: Install Godot 4.6.3 and Web template
        if: steps.tools.outputs.cache-hit != 'true'
        run: |
          mkdir -p .build/tools
          curl --fail --location --retry 3 https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip -o "$RUNNER_TEMP/godot-linux.zip"
          unzip -q "$RUNNER_TEMP/godot-linux.zip" -d .build/tools
          curl --fail --location --retry 3 https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_export_templates.tpz -o "$RUNNER_TEMP/godot-templates.tpz"
          python3 - "$RUNNER_TEMP/godot-templates.tpz" <<'PY'
          import sys, zipfile
          from pathlib import Path
          with zipfile.ZipFile(sys.argv[1]) as archive:
              Path('.build/tools/web_nothreads_release.zip').write_bytes(archive.read('templates/web_nothreads_release.zip'))
          PY
      - name: Verify browser rules and content
        run: |
          npm test
          npm run audit
          node scripts/export-godot-content.mjs
      - name: Build Pages site
        env:
          GODOT_BIN: ${{ github.workspace }}/.build/tools/Godot_v4.6.3-stable_linux.x86_64
          GODOT_WEB_TEMPLATE: ${{ github.workspace }}/.build/tools/web_nothreads_release.zip
        run: python3 scripts/build-pages.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .build/pages
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
