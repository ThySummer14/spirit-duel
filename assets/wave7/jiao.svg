<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 260" role="img" aria-labelledby="title desc">
  <title id="title">椒图</title>
  <desc id="desc">椒图：明珠涌流，护主分担</desc>
  <defs>
    <linearGradient id="jiao-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#081418"/>
      <stop offset=".55" stop-color="#102430"/>
      <stop offset="1" stop-color="#061014"/>
    </linearGradient>
    <radialGradient id="jiao-halo" cx=".5" cy=".44" r=".6">
