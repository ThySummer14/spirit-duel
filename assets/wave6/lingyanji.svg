  <desc id="desc">铃彦姬：神火铃与焰舌，铃振焰升</desc>
  <defs>
    <linearGradient id="lingyanji-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#180c08"/>
      <stop offset=".55" stop-color="#28140c"/>
      <stop offset="1" stop-color="#100804"/>
    </linearGradient>
    <radialGradient id="lingyanji-halo" cx=".5" cy=".44" r=".6">
      <stop offset="0" stop-color="#f0a060" stop-opacity=".45"/>
      <stop offset=".5" stop-color="#d05020" stop-opacity=".18"/>
      <stop offset="1" stop-color="#d05020" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lingyanji-body" x1=".2" y1="0" x2=".9" y2="1">
