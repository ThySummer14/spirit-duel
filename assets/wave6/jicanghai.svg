<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 260" role="img" aria-labelledby="title desc">
  <title id="title">季沧海</title>
  <desc id="desc">季沧海：蓄力崩山斩，烈势如火</desc>
  <defs>
    <linearGradient id="jicanghai-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#180c08"/>
      <stop offset=".55" stop-color="#28140c"/>
      <stop offset="1" stop-color="#100804"/>
    </linearGradient>
    <radialGradient id="jicanghai-halo" cx=".5" cy=".44" r=".6">
      <stop offset="0" stop-color="#f0a050" stop-opacity=".45"/>
      <stop offset=".5" stop-color="#d05818" stop-opacity=".18"/>
      <stop offset="1" stop-color="#d05818" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="jicanghai-body" x1=".2" y1="0" x2=".9" y2="1">
      <stop offset="0" stop-color="#f0d0a8"/>
