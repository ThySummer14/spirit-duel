<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 260" role="img" aria-labelledby="title desc">
  <title id="title">寻香行</title>
  <desc id="desc">寻香行：燃香蚀印，缚梦明香</desc>
  <defs>
    <linearGradient id="xunxiangxing-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14100c"/>
      <stop offset=".55" stop-color="#201814"/>
      <stop offset="1" stop-color="#0c0a08"/>
    </linearGradient>
    <radialGradient id="xunxiangxing-halo" cx=".5" cy=".44" r=".6">
      <stop offset="0" stop-color="#e0b080" stop-opacity=".45"/>
      <stop offset=".5" stop-color="#c08040" stop-opacity=".18"/>
      <stop offset="1" stop-color="#c08040" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="xunxiangxing-body" x1=".2" y1="0" x2=".9" y2="1">
      <stop offset="0" stop-color="#f0d8b8"/>
