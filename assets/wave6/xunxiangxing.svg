    <path d="M100 145c-2-18 8-28 4-45-2-12 4-22 2-35" fill="none" stroke="url(#xunxiangxing-acc)" stroke-width="2" stroke-linecap="round"/>
    <path d="M85 155c-8-15 2-28-2-42M115 155c8-15-2-28 2-42" fill="none" stroke="url(#xunxiangxing-body)" stroke-width="1.6" opacity=".7" stroke-linecap="round"/>
    <circle cx="106" cy="55" r="5" fill="url(#xunxiangxing-gold)" opacity=".7"/>
    <path d="M55 185h90" stroke="url(#xunxiangxing-gold)" stroke-width="1.5" opacity=".5"/>
