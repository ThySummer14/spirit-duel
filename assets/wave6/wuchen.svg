<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 260" role="img" aria-labelledby="title desc">
  <title id="title">无尘</title>
  <desc id="desc">无尘：双环振刀，步虚剑阵</desc>
  <defs>
    <linearGradient id="wuchen-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c0c14"/>
      <stop offset=".55" stop-color="#141420"/>
      <stop offset="1" stop-color="#080810"/>
    </linearGradient>
    <radialGradient id="wuchen-halo" cx=".5" cy=".44" r=".6">
      <stop offset="0" stop-color="#90a0e0" stop-opacity=".45"/>
      <stop offset=".5" stop-color="#5060a0" stop-opacity=".18"/>
      <stop offset="1" stop-color="#5060a0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wuchen-body" x1=".2" y1="0" x2=".9" y2="1">
      <stop offset="0" stop-color="#d0d4f0"/>
      <stop offset=".55" stop-color="#8890c0"/>
      <stop offset="1" stop-color="#5060a0"/>
    </linearGradient>
    <linearGradient id="wuchen-acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5060a0"/>
      <stop offset="1" stop-color="#202850"/>
    </linearGradient>
    <linearGradient id="wuchen-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd98a"/>
      <stop offset="1" stop-color="#c9762c"/>
    </linearGradient>
  </defs>
  <rect width="200" height="260" fill="url(#wuchen-bg)"/>
  <circle cx="100" cy="112" r="86" fill="url(#wuchen-halo)"/>
  <g fill="none" stroke="url(#wuchen-acc)" stroke-width="2.5">
    <circle cx="75" cy="115" r="28"/>
    <circle cx="125" cy="115" r="28"/>
  </g>
  <g fill="none" stroke="url(#wuchen-gold)" stroke-width="1.4" opacity=".8">
