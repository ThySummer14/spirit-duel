    <linearGradient id="jinranbuye-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd98a"/>
      <stop offset="1" stop-color="#c9762c"/>
    </linearGradient>
  </defs>
  <rect width="200" height="260" fill="url(#jinranbuye-bg)"/>
  <circle cx="100" cy="112" r="86" fill="url(#jinranbuye-halo)"/>
  <g>
    <path d="M100 165c-25-15-35-45-20-75 8 18 15 32 20 45 5-13 12-27 20-45 15 30 5 60-20 75Z" fill="url(#jinranbuye-body)" opacity=".75" stroke="#402010" stroke-width="1.5"/>
    <path d="M100 155c-8-12-12-28-8-42 3 10 6 18 8 28 2-10 5-18 8-28 4 14 0 30-8 42Z" fill="url(#jinranbuye-acc)" opacity=".7"/>
    <circle cx="100" cy="70" r="6" fill="url(#jinranbuye-gold)"/>
    <circle cx="72" cy="95" r="3" fill="url(#jinranbuye-gold)" opacity=".8"/>
