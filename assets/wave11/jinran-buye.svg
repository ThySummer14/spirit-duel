<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 260" role="img" aria-labelledby="title desc">
  <title id="title">烬染不夜</title>
  <desc id="desc">烬染不夜：不知火星火，夜舞余烬</desc>
  <defs>
    <linearGradient id="jinranbuye-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#180c08"/>
      <stop offset=".55" stop-color="#28140c"/>
      <stop offset="1" stop-color="#100804"/>
    </linearGradient>
    <radialGradient id="jinranbuye-halo" cx=".5" cy=".44" r=".6">
      <stop offset="0" stop-color="#f08850" stop-opacity=".45"/>
      <stop offset=".5" stop-color="#d04820" stop-opacity=".18"/>
      <stop offset="1" stop-color="#d04820" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="jinranbuye-body" x1=".2" y1="0" x2=".9" y2="1">
      <stop offset="0" stop-color="#f0c0a0"/>
      <stop offset=".55" stop-color="#c06840"/>
      <stop offset="1" stop-color="#d04820"/>
    </linearGradient>
    <linearGradient id="jinranbuye-acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d04820"/>
      <stop offset="1" stop-color="#702010"/>
