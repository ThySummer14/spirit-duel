<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 260" role="img" aria-labelledby="title desc">
  <title id="title">银狼 · 狼牙</title>
  <desc id="desc">霜白狼首覆以青钢面甲，双月牙刃交叉于颌前，寒气凝成雪尘环绕</desc>
  <defs>
    <linearGradient id="fb-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e1620"/>
      <stop offset=".55" stop-color="#15222e"/>
      <stop offset="1" stop-color="#0a1016"/>
    </linearGradient>
    <radialGradient id="fb-halo" cx=".5" cy=".44" r=".6">
      <stop offset="0" stop-color="#cfe8ff" stop-opacity=".45"/>
      <stop offset=".45" stop-color="#7fa8c9" stop-opacity=".2"/>
      <stop offset="1" stop-color="#7fa8c9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fb-fur" x1=".2" y1="0" x2=".85" y2="1">
      <stop offset="0" stop-color="#f2f7fb"/>
      <stop offset=".5" stop-color="#c9d9e6"/>
      <stop offset="1" stop-color="#8ba6bd"/>
    </linearGradient>
    <linearGradient id="fb-blade" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#5d84a8"/>
      <stop offset=".5" stop-color="#bcd8ec"/>
      <stop offset="1" stop-color="#eef7ff"/>
    </linearGradient>
    <linearGradient id="fb-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe2a0"/>
      <stop offset="1" stop-color="#b98c3a"/>
    </linearGradient>
  </defs>
  <rect width="200" height="260" fill="url(#fb-bg)"/>
  <circle cx="100" cy="112" r="86" fill="url(#fb-halo)"/>
  <g opacity=".55" fill="#cfe8ff">
    <circle cx="34" cy="52" r="2"/><circle cx="168" cy="40" r="1.6"/><circle cx="180" cy="96" r="1.4"/>
    <circle cx="24" cy="150" r="1.6"/><circle cx="172" cy="176" r="2"/><circle cx="52" cy="222" r="1.4"/>
  </g>
  <!-- 交叉月牙双刃 -->
  <g>
    <path d="M38 176 Q86 148 150 96 L158 104 Q104 160 46 186 Z" fill="url(#fb-blade)" opacity=".92"/>
    <path d="M162 176 Q114 148 50 96 L42 104 Q96 160 154 186 Z" fill="url(#fb-blade)" opacity=".78"/>
    <circle cx="100" cy="141" r="7" fill="none" stroke="url(#fb-gold)" stroke-width="2.5"/>
  </g>
  <!-- 狼首 -->
  <g>
    <path d="M100 52 L142 84 L136 138 Q100 162 64 138 L58 84 Z" fill="url(#fb-fur)"/>
    <path d="M100 52 L142 84 L128 92 L100 74 L72 92 L58 84 Z" fill="#e6eff6"/>
    <!-- 面甲 -->
    <path d="M100 66 L130 88 L126 118 Q100 134 74 118 L70 88 Z" fill="#22303e" opacity=".92"/>
    <path d="M100 66 L130 88 L100 104 L70 88 Z" fill="#2e4052"/>
    <circle cx="86" cy="102" r="5" fill="#ffe9b0"/>
    <circle cx="114" cy="102" r="5" fill="#ffe9b0"/>
    <path d="M92 122 L108 122 L100 130 Z" fill="#0d141c"/>
    <!-- 獠牙 -->
    <path d="M80 132 L86 146 L90 132 Z" fill="#f2f7fb"/>
    <path d="M120 132 L114 146 L110 132 Z" fill="#f2f7fb"/>
    <!-- 额痕 -->
    <path d="M100 70 L100 96" stroke="url(#fb-gold)" stroke-width="2.4"/>
    <circle cx="100" cy="66" r="3.4" fill="url(#fb-gold)"/>
  </g>
  <!-- 霜尘 -->
  <g fill="#dff0ff" opacity=".8">
    <circle cx="60" cy="70" r="1.6"/><circle cx="146" cy="62" r="1.3"/><circle cx="150" cy="130" r="1.5"/>
    <circle cx="48" cy="118" r="1.2"/><circle cx="100" cy="196" r="1.6"/><circle cx="70" cy="206" r="1.2"/>
  </g>
  <rect x="6" y="6" width="188" height="248" fill="none" stroke="#7fa8c9" stroke-opacity=".35" rx="10"/>
</svg>
