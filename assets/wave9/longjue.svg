<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 260" role="img" aria-labelledby="title desc">
  <title id="title">龙珏</title>
  <desc id="desc">龙珏：龙珠与乾坤两仪，飞龙行道</desc>
  <defs>
    <linearGradient id="longjue-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c1418"/>
      <stop offset=".55" stop-color="#142430"/>
      <stop offset="1" stop-color="#080c12"/>
    </linearGradient>
    <radialGradient id="longjue-halo" cx=".5" cy=".44" r=".6">
      <stop offset="0" stop-color="#50a0c0" stop-opacity=".45"/>
      <stop offset=".5" stop-color="#2080b0" stop-opacity=".18"/>
      <stop offset="1" stop-color="#2080b0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="longjue-body" x1=".2" y1="0" x2=".9" y2="1">
