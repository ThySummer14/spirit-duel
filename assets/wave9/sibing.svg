<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 260" role="img" aria-labelledby="title desc">
  <title id="title">四饼</title>
  <desc id="desc">四饼：托盘折敷与猫又，本膳旨味</desc>
  <defs>
    <linearGradient id="sibing-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#18140c"/>
      <stop offset=".55" stop-color="#282014"/>
      <stop offset="1" stop-color="#100e08"/>
    </linearGradient>
    <radialGradient id="sibing-halo" cx=".5" cy=".44" r=".6">
      <stop offset="0" stop-color="#e0b070" stop-opacity=".45"/>
      <stop offset=".5" stop-color="#c08030" stop-opacity=".18"/>
      <stop offset="1" stop-color="#c08030" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sibing-body" x1=".2" y1="0" x2=".9" y2="1">
      <stop offset="0" stop-color="#f8e8c0"/>
      <stop offset=".55" stop-color="#c09060"/>
      <stop offset="1" stop-color="#c08030"/>
    </linearGradient>
    <linearGradient id="sibing-acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c08030"/>
      <stop offset="1" stop-color="#603810"/>
    </linearGradient>
    <linearGradient id="sibing-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd98a"/>
      <stop offset="1" stop-color="#c9762c"/>
    </linearGradient>
  </defs>
  <rect width="200" height="260" fill="url(#sibing-bg)"/>
  <circle cx="100" cy="112" r="86" fill="url(#sibing-halo)"/>
  <g>
    <ellipse cx="100" cy="150" rx="48" ry="14" fill="url(#sibing-body)" stroke="#3a2810" stroke-width="1.8"/>
    <ellipse cx="100" cy="138" rx="36" ry="16" fill="url(#sibing-acc)" opacity=".85"/>
    <circle cx="88" cy="128" r="10" fill="url(#sibing-gold)" opacity=".8"/>
    <circle cx="112" cy="128" r="10" fill="url(#sibing-gold)" opacity=".8"/>
    <circle cx="100" cy="148" r="10" fill="url(#sibing-gold)" opacity=".65"/>
  </g>
<g fill="url(#sibing-acc)">
    <circle cx="40" cy="80" r="2" opacity=".6"/>
    <circle cx="160" cy="86" r="1.8" opacity=".55"/>
    <circle cx="34" cy="150" r="1.6" opacity=".5"/>
    <circle cx="168" cy="154" r="1.6" opacity=".5"/>
    <circle cx="100" cy="40" r="1.8" opacity=".55"/>
    <circle cx="70" cy="200" r="1.5" opacity=".5"/>
    <circle cx="130" cy="200" r="1.5" opacity=".5"/>
  </g>
  <ellipse cx="100" cy="222" rx="52" ry="9" fill="#000" opacity=".4"/>
  <rect width="200" height="260" fill="none" stroke="#c08030" stroke-opacity=".35" stroke-width="1.5" rx="10"/>
</svg>
