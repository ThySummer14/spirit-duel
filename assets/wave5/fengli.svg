  <defs>
    <linearGradient id="fengli-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c1412"/>
      <stop offset=".55" stop-color="#14201c"/>
      <stop offset="1" stop-color="#080c0a"/>
    </linearGradient>
    <radialGradient id="fengli-halo" cx=".5" cy=".44" r=".6">
