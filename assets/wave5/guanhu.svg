<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 260" role="img" aria-labelledby="title desc">
  <title id="title">管狐</title>
  <desc id="desc">管狐：竹管火器与狐爪，印记生焰</desc>
  <defs>
    <linearGradient id="guanhu-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141008"/>
      <stop offset=".55" stop-color="#201810"/>
      <stop offset="1" stop-color="#0c0a06"/>
    </linearGradient>
    <radialGradient id="guanhu-halo" cx=".5" cy=".44" r=".6">
      <stop offset="0" stop-color="#d0a060" stop-opacity=".45"/>
      <stop offset=".5" stop-color="#b07030" stop-opacity=".18"/>
      <stop offset="1" stop-color="#b07030" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="guanhu-body" x1=".2" y1="0" x2=".9" y2="1">
