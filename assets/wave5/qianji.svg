<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 260" role="img" aria-labelledby="title desc">
  <title id="title">千姬</title>
  <desc id="desc">千姬：海原贝戟与潮纹，珠光流转</desc>
  <defs>
    <linearGradient id="qianji-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#081018"/>
      <stop offset=".55" stop-color="#102030"/>
      <stop offset="1" stop-color="#060a12"/>
    </linearGradient>
    <radialGradient id="qianji-halo" cx=".5" cy=".44" r=".6">
