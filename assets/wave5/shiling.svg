<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 260" role="img" aria-labelledby="title desc">
  <title id="title">食灵</title>
  <desc id="desc">食灵：汤锅与灶火，热气腾腾</desc>
  <defs>
    <linearGradient id="shiling-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#180c08"/>
      <stop offset=".55" stop-color="#281410"/>
      <stop offset="1" stop-color="#100806"/>
    </linearGradient>
    <radialGradient id="shiling-halo" cx=".5" cy=".44" r=".6">
