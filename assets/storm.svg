<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 260" role="img" aria-labelledby="title desc">
  <title id="title">霆鸢 · 鸣羽</title>
  <desc id="desc">雷鸣之灵：鸢鸟自雷云俯冲展翼，羽刃携电光划破紫夜，青雷主调</desc>
  <defs>
    <linearGradient id="s-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1016"/>
      <stop offset=".55" stop-color="#101a26"/>
      <stop offset="1" stop-color="#080d12"/>
    </linearGradient>
    <radialGradient id="s-halo" cx=".5" cy=".42" r=".6">
      <stop offset="0" stop-color="#8ef0ff" stop-opacity=".44"/>
      <stop offset=".5" stop-color="#1599b5" stop-opacity=".2"/>
      <stop offset="1" stop-color="#1599b5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="s-bird" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfeef7"/>
      <stop offset=".6" stop-color="#5da8c4"/>
      <stop offset="1" stop-color="#1d5468"/>
    </linearGradient>
    <linearGradient id="s-bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eafcff"/>
      <stop offset="1" stop-color="#37c6e8"/>
    </linearGradient>
  </defs>
  <rect width="200" height="260" fill="url(#s-bg)"/>
  <circle cx="100" cy="108" r="88" fill="url(#s-halo)"/>
  <!-- 雷云 -->
  <g fill="#1a2634" opacity=".9">
    <ellipse cx="56" cy="52" rx="34" ry="14"/>
    <ellipse cx="146" cy="46" rx="38" ry="15"/>
    <ellipse cx="100" cy="38" rx="44" ry="16"/>
  </g>
  <!-- 电光 -->
  <g fill="url(#s-bolt)">
    <path d="M92 40l-10 28h10l-8 26 22-34h-11l9-20Z" opacity=".95"/>
    <path d="M40 74l-6 16h8l-7 18 17-20h-9l7-14Z" opacity=".6"/>
    <path d="M164 82l-6 15h8l-7 17 16-19h-9l7-13Z" opacity=".6"/>
  </g>
  <!-- 鸢鸟俯冲 -->
  <g transform="translate(100 128)">
    <path d="M0-38c6 0 10 4 12 9l58-18-44 30c-2 14-12 24-26 24S-24 47-26 33l-44-30 58 18c2-5 6-9 12-9Z" fill="url(#s-bird)" stroke="#0d2833" stroke-width="2"/>
    <path d="M0-38c6 0 10 4 12 9l58-18-52 22-18-4-18 4-52-22 58 18c2-5 6-9 12-9Z" fill="#a8e2f2" opacity=".85"/>
    <path d="M0 25c8 0 14 6 14 14l-8 34-6 10-6-10-8-34c0-8 6-14 14-14Z" fill="url(#s-bird)"/>
    <path d="M-14 39l14 6 14-6-14 44Z" fill="#eafcff" opacity=".9"/>
    <circle cx="-7" cy="-26" r="2.6" fill="#0d2833"/>
    <circle cx="7" cy="-26" r="2.6" fill="#0d2833"/>
    <path d="M0-20l-6 8h12Z" fill="#37c6e8"/>
  </g>
  <!-- 风羽痕 -->
  <g stroke="#8ef0ff" stroke-opacity=".5" stroke-width="1.4" fill="none" stroke-linecap="round">
    <path d="M22 150c14 6 26 6 40 2M138 148c14 4 26 4 40-2M40 190c12 4 22 4 34 0M126 188c12 4 22 4 34 0"/>
  </g>
  <!-- 雨珠 -->
  <g fill="#8ef0ff">
    <circle cx="34" cy="98" r="1.5" opacity=".7"/>
    <circle cx="172" cy="120" r="1.8" opacity=".6"/>
    <circle cx="60" cy="222" r="1.4" opacity=".5"/>
    <circle cx="148" cy="216" r="1.6" opacity=".5"/>
    <circle cx="100" cy="234" r="1.2" opacity=".4"/>
  </g>
  <rect width="200" height="260" fill="none" stroke="#1599b5" stroke-opacity=".4" stroke-width="1.5" rx="10"/>
</svg>
