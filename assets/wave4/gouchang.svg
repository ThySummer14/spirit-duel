      <stop offset="1" stop-color="#184040"/>
    </linearGradient>
    <linearGradient id="gouchang-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd98a"/>
      <stop offset="1" stop-color="#c9762c"/>
