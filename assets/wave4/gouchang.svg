  </defs>
  <rect width="200" height="260" fill="url(#gouchang-bg)"/>
  <circle cx="100" cy="112" r="86" fill="url(#gouchang-halo)"/>
  <g>
    <rect x="85" y="100" width="30" height="55" rx="4" fill="url(#gouchang-body)" stroke="#1a3030" stroke-width="1.6"/>
    <path d="M85 100c0-12 6-20 15-20s15 8 15 20" fill="url(#gouchang-acc)"/>
    <g fill="#c8f0f0" opacity=".65">
      <circle cx="60" cy="95" r="8"/><circle cx="145" cy="90" r="6"/>
      <circle cx="55" cy="145" r="5"/><circle cx="150" cy="140" r="7"/>
