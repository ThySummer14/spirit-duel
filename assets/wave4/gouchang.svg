<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 260" role="img" aria-labelledby="title desc">
  <title id="title">垢尝</title>
  <desc id="desc">垢尝：澡刷与净泡，阶前净雪</desc>
  <defs>
    <linearGradient id="gouchang-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1414"/>
      <stop offset=".55" stop-color="#122424"/>
      <stop offset="1" stop-color="#080e0e"/>
    </linearGradient>
    <radialGradient id="gouchang-halo" cx=".5" cy=".44" r=".6">
      <stop offset="0" stop-color="#80c8c8" stop-opacity=".45"/>
      <stop offset=".5" stop-color="#408888" stop-opacity=".18"/>
      <stop offset="1" stop-color="#408888" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gouchang-body" x1=".2" y1="0" x2=".9" y2="1">
      <stop offset="0" stop-color="#c8e8e8"/>
      <stop offset=".55" stop-color="#70a8a8"/>
      <stop offset="1" stop-color="#408888"/>
    </linearGradient>
    <linearGradient id="gouchang-acc" x1="0" y1="0" x2="1" y2="1">
