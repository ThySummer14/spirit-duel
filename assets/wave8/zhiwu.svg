      <stop offset="1" stop-color="#504030"/>
    </linearGradient>
    <linearGradient id="zhiwu-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd98a"/>
      <stop offset="1" stop-color="#c9762c"/>
    </linearGradient>
  </defs>
  <rect width="200" height="260" fill="url(#zhiwu-bg)"/>
  <circle cx="100" cy="112" r="86" fill="url(#zhiwu-halo)"/>
  <g>
    <path d="M55 80l45-25 45 25-45 25z" fill="url(#zhiwu-body)" opacity=".5" stroke="#2a2040" stroke-width="1.2"/>
    <path d="M55 120l45-25 45 25-45 25z" fill="url(#zhiwu-acc)" opacity=".45" stroke="#2a2040" stroke-width="1"/>
    <path d="M55 160l45-25 45 25-45 25z" fill="url(#zhiwu-body)" opacity=".4" stroke="#2a2040" stroke-width="1"/>
  </g>
<g fill="url(#zhiwu-acc)">
