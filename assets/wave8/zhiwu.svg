<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 260" role="img" aria-labelledby="title desc">
  <title id="title">纸舞</title>
  <desc id="desc">纸舞：落纸日轮，砚上翩跹</desc>
  <defs>
    <linearGradient id="zhiwu-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14120e"/>
      <stop offset=".55" stop-color="#201c18"/>
      <stop offset="1" stop-color="#0c0a08"/>
    </linearGradient>
    <radialGradient id="zhiwu-halo" cx=".5" cy=".44" r=".6">
      <stop offset="0" stop-color="#f0e0d0" stop-opacity=".45"/>
      <stop offset=".5" stop-color="#a08060" stop-opacity=".18"/>
      <stop offset="1" stop-color="#a08060" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="zhiwu-body" x1=".2" y1="0" x2=".9" y2="1">
      <stop offset="0" stop-color="#f8f0e8"/>
      <stop offset=".55" stop-color="#c0b0a0"/>
      <stop offset="1" stop-color="#a08060"/>
    </linearGradient>
    <linearGradient id="zhiwu-acc" x1="0" y1="0" x2="1" y2="1">
