<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 260" role="img" aria-labelledby="title desc">
  <title id="title">骨女</title>
  <desc id="desc">骨女：骸骨转生，怨生赤霞</desc>
  <defs>
    <linearGradient id="gunv-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#120e0c"/>
      <stop offset=".55" stop-color="#1c1614"/>
      <stop offset="1" stop-color="#0c0a08"/>
    </linearGradient>
    <radialGradient id="gunv-halo" cx=".5" cy=".44" r=".6">
