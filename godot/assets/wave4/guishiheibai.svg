<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 260" role="img" aria-labelledby="title desc">
  <title id="title">鬼使黑/鬼使白</title>
  <desc id="desc">鬼使黑/鬼使白：黑白双镰交辉，无常引路</desc>
  <defs>
    <linearGradient id="guishiheibai-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c0c10"/>
      <stop offset=".55" stop-color="#14141c"/>
      <stop offset="1" stop-color="#08080c"/>
    </linearGradient>
    <radialGradient id="guishiheibai-halo" cx=".5" cy=".44" r=".6">
      <stop offset="0" stop-color="#9090b0" stop-opacity=".45"/>
      <stop offset=".5" stop-color="#505070" stop-opacity=".18"/>
      <stop offset="1" stop-color="#505070" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="guishiheibai-body" x1=".2" y1="0" x2=".9" y2="1">
