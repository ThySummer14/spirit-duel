<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 260" role="img" aria-labelledby="title desc">
  <title id="title">缘结神</title>
  <desc id="desc">缘结神：绯色缘结与月绳，双环相扣</desc>
  <defs>
    <linearGradient id="jieshen-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#140c10"/>
      <stop offset=".55" stop-color="#201418"/>
      <stop offset="1" stop-color="#0c080c"/>
    </linearGradient>
    <radialGradient id="jieshen-halo" cx=".5" cy=".44" r=".6">
