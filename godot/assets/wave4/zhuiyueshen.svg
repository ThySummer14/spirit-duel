<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 260" role="img" aria-labelledby="title desc">
  <title id="title">追月神</title>
  <desc id="desc">追月神：月相轮回与宵月，三相拱月</desc>
  <defs>
    <linearGradient id="zhuiyueshen-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#100c18"/>
      <stop offset=".55" stop-color="#181428"/>
      <stop offset="1" stop-color="#0a0812"/>
    </linearGradient>
    <radialGradient id="zhuiyueshen-halo" cx=".5" cy=".44" r=".6">
      <stop offset="0" stop-color="#b0a0e0" stop-opacity=".45"/>
      <stop offset=".5" stop-color="#7060a0" stop-opacity=".18"/>
      <stop offset="1" stop-color="#7060a0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="zhuiyueshen-body" x1=".2" y1="0" x2=".9" y2="1">
      <stop offset="0" stop-color="#d8d0f0"/>
      <stop offset=".55" stop-color="#9080b0"/>
      <stop offset="1" stop-color="#7060a0"/>
    </linearGradient>
    <linearGradient id="zhuiyueshen-acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7060a0"/>
      <stop offset="1" stop-color="#302860"/>
    </linearGradient>
    <linearGradient id="zhuiyueshen-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd98a"/>
      <stop offset="1" stop-color="#c9762c"/>
    </linearGradient>
  </defs>
  <rect width="200" height="260" fill="url(#zhuiyueshen-bg)"/>
  <circle cx="100" cy="112" r="86" fill="url(#zhuiyueshen-halo)"/>
  <g>
    <circle cx="100" cy="105" r="36" fill="url(#zhuiyueshen-body)" opacity=".55"/>
    <circle cx="112" cy="105" r="30" fill="url(#zhuiyueshen-bg)" opacity=".85"/>
    <circle cx="100" cy="105" r="8" fill="url(#zhuiyueshen-gold)"/>
  </g>
  <g fill="url(#zhuiyueshen-acc)" opacity=".7">
    <circle cx="55" cy="70" r="6"/><circle cx="55" cy="70" r="3" fill="url(#zhuiyueshen-bg)"/>
    <circle cx="145" cy="70" r="6"/>
    <circle cx="48" cy="160" r="5" fill="url(#zhuiyueshen-bg)" stroke="url(#zhuiyueshen-acc)" stroke-width="1"/>
    <circle cx="152" cy="160" r="5"/>
  </g>
<g fill="url(#zhuiyueshen-acc)">
    <circle cx="40" cy="100" r="2" opacity=".6"/>
    <circle cx="160" cy="102" r="1.8" opacity=".55"/>
    <circle cx="70" cy="200" r="1.6" opacity=".5"/>
    <circle cx="130" cy="200" r="1.6" opacity=".5"/>
    <circle cx="100" cy="32" r="1.8" opacity=".55"/>
  </g>
  <ellipse cx="100" cy="222" rx="52" ry="9" fill="#000" opacity=".4"/>
  <rect width="200" height="260" fill="none" stroke="#7060a0" stroke-opacity=".35" stroke-width="1.5" rx="10"/>
</svg>
