  </defs>
  <rect width="200" height="260" fill="url(#yingxueji-bg)"/>
  <circle cx="100" cy="112" r="86" fill="url(#yingxueji-halo)"/>
  <g fill="url(#yingxueji-acc)" opacity=".85">
