<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 260" role="img" aria-labelledby="title desc">
  <title id="title">樱雪姬</title>
  <desc id="desc">樱雪姬：雪樱五瓣与画笔，樱雪纷飞</desc>
  <defs>
    <linearGradient id="yingxueji-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#140c12"/>
      <stop offset=".55" stop-color="#24141c"/>
      <stop offset="1" stop-color="#0c080c"/>
    </linearGradient>
    <radialGradient id="yingxueji-halo" cx=".5" cy=".44" r=".6">
      <stop offset="0" stop-color="#f0a0c0" stop-opacity=".45"/>
      <stop offset=".5" stop-color="#d06090" stop-opacity=".18"/>
      <stop offset="1" stop-color="#d06090" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="yingxueji-body" x1=".2" y1="0" x2=".9" y2="1">
      <stop offset="0" stop-color="#f8d8e8"/>
