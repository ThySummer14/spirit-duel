  <rect width="200" height="260" fill="url(#leiyin-halo)"/>
  
  <g><polygon points="100,45 130,110 100,105 70,110" fill="url(#p-accent)"/><rect x="70" y="105" width="60" height="70" rx="10" fill="url(#p-body)"/><path d="M85 130 L115 130 M90 150 L110 150" stroke="#f0e8d0" stroke-width="3"/></g>
  <text x="100" y="230" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#f0e8d0">雷音</text>
