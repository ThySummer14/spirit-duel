<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 260" role="img" aria-labelledby="leiyin-t leiyin-d">
  <title id="leiyin-t">雷音</title>
  <desc id="leiyin-d">灵枢原创式神立绘</desc>
  <defs>
    <linearGradient id="leiyin-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#241838"/><stop offset="1" stop-color="#382850"/>
    </linearGradient>
    <radialGradient id="leiyin-halo" cx=".5" cy=".42" r=".55">
      <stop offset="0" stop-color="#e8d0ff" stop-opacity=".4"/><stop offset="1" stop-color="#c0a0e0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="leiyin-body" x1="0" y1="0" x2="1" y2="1">
