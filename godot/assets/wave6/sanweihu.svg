  <defs>
    <linearGradient id="sanweihu-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#180810"/>
      <stop offset=".55" stop-color="#28101c"/>
      <stop offset="1" stop-color="#10060c"/>
    </linearGradient>
    <radialGradient id="sanweihu-halo" cx=".5" cy=".44" r=".6">
      <stop offset="0" stop-color="#f080b0" stop-opacity=".45"/>
      <stop offset=".5" stop-color="#d03070" stop-opacity=".18"/>
      <stop offset="1" stop-color="#d03070" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sanweihu-body" x1=".2" y1="0" x2=".9" y2="1">
