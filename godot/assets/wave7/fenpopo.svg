  <rect width="200" height="260" fill="url(#fenpopo-bg)"/>
  <circle cx="100" cy="112" r="86" fill="url(#fenpopo-halo)"/>
  <path d="M100 48c22 18 34 40 34 64 0 28-16 48-34 62-18-14-34-34-34-62 0-24 12-46 34-64z" fill="url(#fenpopo-body)" stroke="url(#fenpopo-acc)" stroke-width="1.4"/>

