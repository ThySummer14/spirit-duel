<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 260" role="img" aria-labelledby="title desc">
  <title id="title">粉婆婆</title>
  <desc id="desc">粉婆婆：画颜烟粉，过量投射</desc>
  <defs>
    <linearGradient id="fenpopo-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#140c14"/>
      <stop offset=".55" stop-color="#201424"/>
      <stop offset="1" stop-color="#0c0810"/>
    </linearGradient>
    <radialGradient id="fenpopo-halo" cx=".5" cy=".44" r=".6">
      <stop offset="0" stop-color="#f0a0c0" stop-opacity=".45"/>
      <stop offset=".5" stop-color="#c05080" stop-opacity=".18"/>
      <stop offset="1" stop-color="#c05080" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fenpopo-body" x1=".2" y1="0" x2=".9" y2="1">
