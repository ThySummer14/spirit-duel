  <desc id="desc">封阳君：双刀日月与易势，望月星河</desc>
  <defs>
    <linearGradient id="fengyangjun-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#181408"/>
      <stop offset=".55" stop-color="#28200c"/>
      <stop offset="1" stop-color="#100e04"/>
    </linearGradient>
    <radialGradient id="fengyangjun-halo" cx=".5" cy=".44" r=".6">
