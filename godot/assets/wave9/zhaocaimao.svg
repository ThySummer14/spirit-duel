      <stop offset="0" stop-color="#181408"/>
      <stop offset=".55" stop-color="#28200c"/>
      <stop offset="1" stop-color="#100e04"/>
    </linearGradient>
    <radialGradient id="zhaocaimao-halo" cx=".5" cy=".44" r=".6">
