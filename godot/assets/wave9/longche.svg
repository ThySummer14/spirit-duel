    <circle cx="160" cy="86" r="1.8" opacity=".55"/>
    <circle cx="34" cy="150" r="1.6" opacity=".5"/>
    <circle cx="168" cy="154" r="1.6" opacity=".5"/>
    <circle cx="100" cy="40" r="1.8" opacity=".55"/>
    <circle cx="70" cy="200" r="1.5" opacity=".5"/>
    <circle cx="130" cy="200" r="1.5" opacity=".5"/>
