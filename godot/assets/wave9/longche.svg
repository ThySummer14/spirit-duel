<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 260" role="img" aria-labelledby="title desc">
  <title id="title">胧车</title>
  <desc id="desc">胧车：幽灵牛车与呱太，呱太军团</desc>
  <defs>
    <linearGradient id="longche-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c180c"/>
      <stop offset=".55" stop-color="#142814"/>
      <stop offset="1" stop-color="#080e08"/>
    </linearGradient>
    <radialGradient id="longche-halo" cx=".5" cy=".44" r=".6">
      <stop offset="0" stop-color="#80c090" stop-opacity=".45"/>
      <stop offset=".5" stop-color="#30a060" stop-opacity=".18"/>
      <stop offset="1" stop-color="#30a060" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="longche-body" x1=".2" y1="0" x2=".9" y2="1">
      <stop offset="0" stop-color="#c8e8d0"/>
      <stop offset=".55" stop-color="#60a078"/>
      <stop offset="1" stop-color="#30a060"/>
    </linearGradient>
    <linearGradient id="longche-acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#30a060"/>
      <stop offset="1" stop-color="#184830"/>
    </linearGradient>
    <linearGradient id="longche-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd98a"/>
      <stop offset="1" stop-color="#c9762c"/>
    </linearGradient>
  </defs>
  <rect width="200" height="260" fill="url(#longche-bg)"/>
  <circle cx="100" cy="112" r="86" fill="url(#longche-halo)"/>
  <g>
    <circle cx="100" cy="130" r="40" fill="none" stroke="url(#longche-body)" stroke-width="6"/>
    <circle cx="100" cy="130" r="10" fill="url(#longche-gold)"/>
    <path d="M100 90v20M100 150v20M60 130h20M120 130h20" stroke="url(#longche-acc)" stroke-width="2.5"/>
    <ellipse cx="100" cy="175" rx="18" ry="10" fill="url(#longche-acc)" opacity=".75"/>
