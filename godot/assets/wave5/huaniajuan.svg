  <defs>
    <linearGradient id="huaniajuan-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#180c14"/>
      <stop offset=".55" stop-color="#28141c"/>
      <stop offset="1" stop-color="#10080c"/>
    </linearGradient>
    <radialGradient id="huaniajuan-halo" cx=".5" cy=".44" r=".6">
      <stop offset="0" stop-color="#e0a0c0" stop-opacity=".45"/>
      <stop offset=".5" stop-color="#c06088" stop-opacity=".18"/>
      <stop offset="1" stop-color="#c06088" stop-opacity="0"/>
