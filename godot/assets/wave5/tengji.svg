  <desc id="desc">藤姬：紫藤垂落如瀑，花串层叠</desc>
  <defs>
    <linearGradient id="tengji-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#140c1c"/>
      <stop offset=".55" stop-color="#201430"/>
      <stop offset="1" stop-color="#0c0814"/>
    </linearGradient>
    <radialGradient id="tengji-halo" cx=".5" cy=".44" r=".6">
      <stop offset="0" stop-color="#c090e0" stop-opacity=".45"/>
      <stop offset=".5" stop-color="#8050c0" stop-opacity=".18"/>
      <stop offset="1" stop-color="#8050c0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tengji-body" x1=".2" y1="0" x2=".9" y2="1">
