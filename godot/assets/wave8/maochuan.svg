<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 260" role="img" aria-labelledby="title desc">
  <title id="title">猫川</title>
  <desc id="desc">猫川：卷轴代价，长河垄断</desc>
  <defs>
    <linearGradient id="maochuan-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#120e0a"/>
      <stop offset=".55" stop-color="#1c1812"/>
      <stop offset="1" stop-color="#0c0a06"/>
    </linearGradient>
    <radialGradient id="maochuan-halo" cx=".5" cy=".44" r=".6">
