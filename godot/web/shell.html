<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#181a25">
  <title>$GODOT_PROJECT_NAME · 网页测试版</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #181a25; }
    body { color: #ede0c7; font-family: system-ui, sans-serif; }
    #canvas { display: block; outline: none; touch-action: none; }
    #status { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; background: #181a25; padding: 24px; box-sizing: border-box; text-align: center; }
    h1 { margin: 0; font-family: serif; font-weight: 500; letter-spacing: .25em; }
    p { margin: 0; color: #c6b8a5; line-height: 1.8; }
    progress { width: min(400px, 80vw); height: 8px; accent-color: #c69768; }
    #notice { white-space: pre-wrap; max-width: 640px; }
    a { color: #dbc196; }
  </style>
  $GODOT_HEAD_INCLUDE
</head>
<body>
  <canvas id="canvas" aria-label="灵枢战线游戏画面">浏览器需要支持 Canvas。</canvas>
  <noscript>请启用 JavaScript 后进入游戏。</noscript>
  <div id="status" role="status" aria-live="polite">
    <h1>灵枢战线</h1>
    <p id="notice">正在载入月汐街…</p>
    <progress id="progress" aria-label="游戏加载进度"></progress>
    <p>首次进入需要下载游戏资源，建议使用电脑浏览器。<br>进入后点击画面即可启用声音；阵容与收藏保存在当前浏览器。</p>
    <a href="../">进入原网页版</a>
  </div>
  <script src="$GODOT_URL"></script>
  <script>
    const GODOT_CONFIG = $GODOT_CONFIG;
    const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
    const engine = new Engine(GODOT_CONFIG);
    const overlay = document.getElementById('status');
    const progress = document.getElementById('progress');
    const notice = document.getElementById('notice');
    function failure(error) {
      console.error(error);
      notice.textContent = '载入失败，请刷新重试，或使用支持 WebGL 2 的浏览器。\n' + (error.message || String(error));
      progress.hidden = true;
      document.documentElement.dataset.gameStatus = 'failed';
    }
    const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
    if (missing.length) {
      failure(new Error(missing.join('\n')));
    } else {
      engine.startGame({ onProgress(current, total) {
        if (total > 0) {
          progress.max = total;
          progress.value = current;
          notice.textContent = '正在载入月汐街… ' + Math.round(current / total * 100) + '%';
        }
      } }).then(() => {
        overlay.remove();
        document.documentElement.dataset.gameStatus = 'running';
      }, failure);
    }
  </script>
</body>
</html>
